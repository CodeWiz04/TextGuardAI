<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMS Spam Classifier</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; font-size: 1rem; padding: 8px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 8px 20px; font-size: 1rem; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 1.1rem; }
        .spam { background-color: #fdd; border: 1px solid #c00; }
        .ham { background-color: #dfd; border: 1px solid #0a0; }
        .error { background-color: #fed; border: 1px solid #d80; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>SMS Spam Classifier</h1>
    <p>Paste an SMS message below to check if it's spam or ham.</p>

    <form method="POST">
        <textarea name="message" placeholder="Type or paste a message here...">{{ submitted_text }}</textarea>
        <br>
        <button type="submit">Check Message</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if result_label %}
        <div class="result {{ 'spam' if result_label == 'Spam' else 'ham' }}">
            <strong>Prediction: {{ result_label }}</strong><br>
            Confidence: {{ confidence_pct }}%
        </div>
    {% endif %}
</body>
</html>
